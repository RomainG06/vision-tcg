<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGradientMagic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2332;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#252E3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1419;stop-opacity:1" />
    </linearGradient>
    <filter id="cardGlowMagic">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.6" flood-color="#7C3AED"/>
    </filter>
    <filter id="cardInnerGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Card background -->
  <rect x="8" y="8" width="304" height="184" rx="8" ry="8" fill="url(#cardGradientMagic)" filter="url(#cardGlowMagic)"/>
  
  <!-- Arcane border (glowing) -->
  <rect x="8" y="8" width="304" height="184" rx="8" ry="8" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.6" filter="url(#cardInnerGlow)"/>
  
  <!-- Inner subtle border -->
  <rect x="10" y="10" width="300" height="180" rx="7" ry="7" fill="none" stroke="#3A4557" stroke-width="1" opacity="0.8"/>
  
  <!-- Ornamental rune corners (pixel style) -->
  <g stroke="#D4AF37" stroke-width="2" fill="none" opacity="0.5" filter="url(#cardInnerGlow)">
    <!-- Top-left -->
    <path d="M 16 16 L 28 16 L 28 28"/>
    <!-- Top-right -->
    <path d="M 304 16 L 292 16 L 292 28"/>
    <!-- Bottom-left -->
    <path d="M 16 184 L 28 184 L 28 172"/>
    <!-- Bottom-right -->
    <path d="M 304 184 L 292 184 L 292 172"/>
  </g>
  
  <!-- Image placeholder area -->
  <rect x="16" y="16" width="100" height="80" rx="4" ry="4" fill="#2A3347" stroke="#7C3AED" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Pixelated texture overlay on image -->
  <g fill="#7C3AED" opacity="0.2">
    <rect x="20" y="20" width="2" height="2"/>
    <rect x="30" y="25" width="2" height="2"/>
    <rect x="40" y="30" width="2" height="2"/>
    <rect x="50" y="22" width="2" height="2"/>
    <rect x="60" y="35" width="2" height="2"/>
    <rect x="70" y="28" width="2" height="2"/>
    <rect x="80" y="32" width="2" height="2"/>
    <rect x="90" y="26" width="2" height="2"/>
  </g>
  
  <!-- Image placeholder text -->
  <text x="66" y="56" font-family="'Inter', sans-serif" font-size="11" fill="#B8BCC4" text-anchor="middle" opacity="0.6">Image</text>
  
  <!-- Eye logo micro-icon (glowing) -->
  <circle cx="112" cy="20" r="6" fill="none" stroke="#00D9FF" stroke-width="2" opacity="0.8" filter="url(#cardInnerGlow)"/>
  <circle cx="112" cy="20" r="3.5" fill="#00D9FF" opacity="0.4"/>
  <circle cx="110" cy="19" r="1" fill="#FFD700"/>
  
  <!-- Content area -->
  <g>
    <!-- Title -->
    <text x="128" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#F8F9FA">Title</text>
    
    <!-- Price (gold glow) -->
    <text x="128" y="56" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#FFD700" filter="url(#cardInnerGlow)">$49.99</text>
    
    <!-- Magical price tag sparkle -->
    <g fill="#FFD700" opacity="0.6">
      <circle cx="145" cy="50" r="1"/>
      <circle cx="155" cy="48" r="0.8"/>
    </g>
    
    <!-- Location icon + text -->
    <circle cx="128" cy="75" r="2.5" fill="#00D9FF" opacity="0.8"/>
    <text x="138" y="78" font-family="'Inter', sans-serif" font-size="12" fill="#B8BCC4">San Francisco, CA</text>
    
    <!-- Arcane divider (pixel line with magic sparkle) -->
    <g fill="#7C3AED" opacity="0.5">
      <rect x="128" y="89" width="2" height="2"/>
      <rect x="134" y="89" width="2" height="2"/>
      <rect x="140" y="89" width="2" height="2"/>
      <rect x="146" y="89" width="2" height="2"/>
      <rect x="152" y="89" width="2" height="2"/>
      <rect x="158" y="89" width="2" height="2"/>
    </g>
    
    <!-- Magic runes between divider and description -->
    <g fill="#FFB700" opacity="0.3">
      <rect x="160" y="91" width="1" height="1"/>
      <rect x="164" y="91" width="1" height="1"/>
    </g>
    
    <!-- Description -->
    <text x="128" y="110" font-family="'Inter', sans-serif" font-size="12" fill="#B8BCC4">Short description or item details here</text>
    
    <!-- Magical indicator glyph (bottom-right corner) -->
    <g stroke="#00D9FF" stroke-width="1.5" fill="none" opacity="0.5" filter="url(#cardInnerGlow)">
      <path d="M 304 168 L 294 168 L 294 178"/>
    </g>
    
    <!-- Corner magic sparkles -->
    <g fill="#00D9FF" opacity="0.4">
      <circle cx="290" cy="165" r="1"/>
      <circle cx="308" cy="175" r="1"/>
    </g>
  </g>
</svg>
