<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="swordGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0B3D91;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <filter id="swordGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Blade (magic) -->
  <path d="M 32 8 L 36 28 L 32 50 L 28 28 Z" fill="url(#swordGradient)" filter="url(#swordGlow)"/>
  
  <!-- Blade glow effect -->
  <path d="M 32 8 L 36 28 L 32 50 L 28 28 Z" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.6" filter="url(#swordGlow)"/>
  
  <!-- Cross-guard (runes) -->
  <rect x="20" y="32" width="24" height="4" rx="2" fill="#D4AF37" opacity="0.8"/>
  <rect x="18" y="31" width="28" height="6" rx="3" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
  
  <!-- Handle (wood) -->
  <rect x="28" y="36" width="8" height="14" rx="2" fill="#5A1F1F" stroke="#8B2323" stroke-width="1"/>
  
  <!-- Handle grip (pixel pattern) -->
  <g fill="#D4AF37" opacity="0.4">
    <rect x="28" y="38" width="2" height="2"/>
    <rect x="34" y="38" width="2" height="2"/>
    <rect x="28" y="42" width="2" height="2"/>
    <rect x="34" y="42" width="2" height="2"/>
    <rect x="28" y="46" width="2" height="2"/>
    <rect x="34" y="46" width="2" height="2"/>
  </g>
  
  <!-- Pommel (magical core) -->
  <circle cx="32" cy="52" r="4" fill="#FFD700" filter="url(#swordGlow)"/>
  <circle cx="32" cy="52" r="3" fill="none" stroke="#FFB700" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Sparkles around blade -->
  <g fill="#00D9FF" opacity="0.7">
    <rect x="18" y="20" width="1.5" height="1.5"/>
    <rect x="44" y="25" width="1.5" height="1.5"/>
    <rect x="20" y="40" width="1.5" height="1.5"/>
    <rect x="42" y="38" width="1.5" height="1.5"/>
  </g>
</svg>
