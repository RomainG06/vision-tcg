<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crystalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C77DFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:1" />
    </linearGradient>
    <filter id="crystalGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Crystal facets (top) -->
  <polygon points="32,8 38,18 26,18" fill="url(#crystalGradient)" filter="url(#crystalGlow)"/>
  
  <!-- Crystal main body -->
  <polygon points="24,18 40,18 44,38 20,38" fill="url(#crystalGradient)" filter="url(#crystalGlow)"/>
  
  <!-- Crystal facets (bottom) -->
  <polygon points="20,38 24,50 32,48 40,50 44,38" fill="url(#crystalGradient)" filter="url(#crystalGlow)"/>
  
  <!-- Inner glow lines -->
  <g stroke="#FFD700" stroke-width="1" opacity="0.5" fill="none">
    <line x1="28" y1="18" x2="30" y2="40"/>
    <line x1="36" y1="18" x2="34" y2="40"/>
    <line x1="32" y1="20" x2="32" y2="46"/>
  </g>
  
  <!-- Light reflection (inner) -->
  <polygon points="26,22 32,20 30,28" fill="#FFD700" opacity="0.6"/>
  
  <!-- Magic aura (pixelated) -->
  <g fill="#C77DFF" opacity="0.3">
    <rect x="14" y="28" width="2" height="2"/>
    <rect x="48" y="28" width="2" height="2"/>
    <rect x="16" y="36" width="2" height="2"/>
    <rect x="46" y="36" width="2" height="2"/>
  </g>
  
  <!-- Outer glow circle (subtle) -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
  
  <!-- Sparkle dots -->
  <g fill="#FFD700" opacity="0.8">
    <circle cx="16" cy="16" r="1"/>
    <circle cx="48" cy="16" r="1"/>
    <circle cx="20" cy="50" r="1"/>
    <circle cx="44" cy="50" r="1"/>
  </g>
</svg>
