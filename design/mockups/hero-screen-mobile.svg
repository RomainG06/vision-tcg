<svg viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradientMobileM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1419;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A2332;stop-opacity:1" />
    </linearGradient>
    <filter id="mobileGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="375" height="812" fill="url(#bgGradientMobileM)"/>
  
  <!-- Status bar -->
  <rect width="375" height="44" fill="#1A2332" stroke="#7C3AED" stroke-width="1" opacity="0.5"/>
  
  <!-- Header bar -->
  <rect y="44" width="375" height="60" fill="#1A2332" stroke="#7C3AED" stroke-width="1.5" opacity="0.6" filter="url(#mobileGlow)"/>
  
  <!-- Header glow line -->
  <line x1="0" y1="104" x2="375" y2="104" stroke="#00D9FF" stroke-width="1" opacity="0.2"/>
  
  <!-- Logo mini -->
  <circle cx="24" cy="74" r="12" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.8"/>
  <circle cx="24" cy="74" r="8" fill="#0B3D91"/>
  <circle cx="20" cy="71" r="2.5" fill="#00D9FF" opacity="0.8"/>
  <circle cx="18" cy="69" r="1" fill="#FFD700"/>
  
  <!-- Title -->
  <text x="48" y="82" font-family="'Cinzel', serif" font-size="18" font-weight="700" fill="#F8F9FA" filter="url(#mobileGlow)">Vision TCG</text>
  
  <!-- Rune accent -->
  <g fill="#D4AF37" opacity="0.3">
    <rect x="48" y="88" width="1" height="1"/>
    <rect x="54" y="88" width="1" height="1"/>
  </g>
  
  <!-- Search bar -->
  <rect x="16" y="116" width="343" height="40" rx="20" fill="#2A3347" stroke="#7C3AED" stroke-width="1.5" opacity="0.5" filter="url(#mobileGlow)"/>
  <text x="36" y="141" font-family="'Inter', sans-serif" font-size="12" fill="#B8BCC4">🔮 Search...</text>
  
  <!-- Scroll content area -->
  <g>
    <!-- Card 1 -->
    <g>
      <rect x="12" y="176" width="351" height="240" rx="10" fill="#252E3E" stroke="#7C3AED" stroke-width="1.5" opacity="0.6" filter="url(#mobileGlow)"/>
      <rect x="14" y="178" width="347" height="236" rx="9" fill="none" stroke="#3A4557" stroke-width="1" opacity="0.7"/>
      
      <!-- Image -->
      <rect x="24" y="188" width="327" height="120" rx="6" fill="#3A4557" stroke="#00D9FF" stroke-width="1" opacity="0.4"/>
      <text x="187.5" y="248" font-family="'Inter', sans-serif" font-size="12" fill="#B8BCC4" text-anchor="middle" opacity="0.6">✨ Image</text>
      
      <!-- Pixel magic -->
      <g fill="#7C3AED" opacity="0.12">
        <rect x="40" y="200" width="1.5" height="1.5"/>
        <rect x="70" y="215" width="1.5" height="1.5"/>
        <rect x="100" y="205" width="1.5" height="1.5"/>
        <rect x="130" y="225" width="1.5" height="1.5"/>
      </g>
      
      <!-- Eye logo -->
      <circle cx="351" cy="196" r="6" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.8" filter="url(#mobileGlow)"/>
      
      <!-- Content -->
      <text x="24" y="328" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#F8F9FA">Rare Holographic</text>
      <text x="24" y="350" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#FFD700" filter="url(#mobileGlow)">$89.99</text>
      
      <!-- Price sparkle -->
      <circle cx="50" cy="343" r="0.8" fill="#FFD700" opacity="0.6"/>
      
      <!-- Location -->
      <circle cx="24" cy="370" r="2" fill="#00D9FF" opacity="0.8"/>
      <text x="32" y="373" font-family="'Inter', sans-serif" font-size="11" fill="#B8BCC4">New York, NY</text>
      
      <!-- Arcane divider -->
      <g fill="#7C3AED" opacity="0.5">
        <rect x="24" y="384" width="1.5" height="1.5"/>
        <rect x="30" y="384" width="1.5" height="1.5"/>
        <rect x="36" y="384" width="1.5" height="1.5"/>
        <rect x="42" y="384" width="1.5" height="1.5"/>
      </g>
    </g>
    
    <!-- Card 2 -->
    <g>
      <rect x="12" y="436" width="351" height="240" rx="10" fill="#252E3E" stroke="#C77DFF" stroke-width="1.5" opacity="0.6" filter="url(#mobileGlow)"/>
      <rect x="14" y="438" width="347" height="236" rx="9" fill="none" stroke="#3A4557" stroke-width="1" opacity="0.7"/>
      
      <rect x="24" y="448" width="327" height="120" rx="6" fill="#3A4557" stroke="#C77DFF" stroke-width="1" opacity="0.4"/>
      <text x="187.5" y="508" font-family="'Inter', sans-serif" font-size="12" fill="#B8BCC4" text-anchor="middle" opacity="0.6">✨ Image</text>
      
      <circle cx="351" cy="456" r="6" fill="none" stroke="#C77DFF" stroke-width="1.5" opacity="0.8" filter="url(#mobileGlow)"/>
      
      <text x="24" y="588" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#F8F9FA">Vintage Collection</text>
      <text x="24" y="610" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#FFD700" filter="url(#mobileGlow)">$45.50</text>
      
      <circle cx="24" cy="630" r="2" fill="#C77DFF" opacity="0.8"/>
      <text x="32" y="633" font-family="'Inter', sans-serif" font-size="11" fill="#B8BCC4">Los Angeles, CA</text>
    </g>
  </g>
  
  <!-- Bottom navigation (heroic fantasy style) -->
  <rect y="752" width="375" height="60" fill="#1A2332" stroke="#7C3AED" stroke-width="1.5" opacity="0.6" filter="url(#mobileGlow)"/>
  
  <!-- Nav top border glow -->
  <line x1="0" y1="752" x2="375" y2="752" stroke="#00D9FF" stroke-width="1" opacity="0.2"/>
  
  <!-- Nav icons with labels -->
  <g>
    <!-- Home - Sword -->
    <g>
      <circle cx="46" cy="782" r="16" fill="#7C3AED" opacity="0.2"/>
      <!-- Sword icon simplified -->
      <line x1="46" y1="770" x2="46" y2="790" stroke="#00D9FF" stroke-width="2" opacity="0.8"/>
      <line x1="40" y1="776" x2="52" y2="776" stroke="#D4AF37" stroke-width="1.5" opacity="0.6"/>
      <text x="46" y="805" font-family="'Inter', sans-serif" font-size="9" fill="#B8BCC4" text-anchor="middle" opacity="0.7">Home</text>
    </g>
    
    <!-- Search - Crystal -->
    <g>
      <!-- Crystal icon simplified -->
      <polygon points="140,775 136,765 144,765" fill="#7C3AED" opacity="0.8"/>
      <polygon points="136,775 140,785 144,775" fill="#7C3AED" opacity="0.6"/>
      <text x="140" y="805" font-family="'Inter', sans-serif" font-size="9" fill="#B8BCC4" text-anchor="middle" opacity="0.7">Search</text>
    </g>
    
    <!-- Add - Grimoire -->
    <g>
      <circle cx="187.5" cy="782" r="18" fill="#D4AF37" opacity="0.2"/>
      <circle cx="187.5" cy="782" r="16" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.8"/>
      <!-- Plus inside -->
      <line x1="187.5" y1="770" x2="187.5" y2="790" stroke="#FFD700" stroke-width="2" opacity="0.9"/>
      <line x1="176" y1="782" x2="199" y2="782" stroke="#FFD700" stroke-width="2" opacity="0.9"/>
      <text x="187.5" y="805" font-family="'Inter', sans-serif" font-size="9" fill="#B8BCC4" text-anchor="middle" opacity="0.7">Add</text>
    </g>
    
    <!-- Messages - Scroll -->
    <g>
      <!-- Scroll icon simplified -->
      <rect x="277" y="765" width="10" height="20" rx="1" fill="none" stroke="#B8BCC4" stroke-width="1.5" opacity="0.6"/>
      <line x1="279" y1="770" x2="285" y2="770" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
      <line x1="279" y1="776" x2="285" y2="776" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
      <text x="281" y="805" font-family="'Inter', sans-serif" font-size="9" fill="#B8BCC4" text-anchor="middle" opacity="0.7">Messages</text>
    </g>
    
    <!-- Profile - Crown -->
    <g>
      <circle cx="328" cy="782" r="14" fill="#7C3AED" opacity="0.3"/>
      <!-- Crown icon simplified -->
      <path d="M 322 785 L 325 775 L 328 780 L 331 775 L 334 785" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.8" stroke-linecap="round"/>
      <line x1="320" y1="785" x2="336" y2="785" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
      <text x="328" y="805" font-family="'Inter', sans-serif" font-size="9" fill="#B8BCC4" text-anchor="middle" opacity="0.7">Profile</text>
    </g>
  </g>
  
  <!-- Pixel accent corners -->
  <g stroke="#D4AF37" stroke-width="1.5" fill="none" opacity="0.3" filter="url(#mobileGlow)">
    <path d="M 8 8 L 20 8 L 20 20"/>
    <path d="M 367 8 L 355 8 L 355 20"/>
    <path d="M 8 804 L 20 804 L 20 792"/>
    <path d="M 367 804 L 355 804 L 355 792"/>
  </g>
</svg>
