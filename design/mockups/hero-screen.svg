<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradientMagic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1419;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A2332;stop-opacity:1" />
    </linearGradient>
    <filter id="headerGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="900" fill="url(#bgGradientMagic)"/>
  
  <!-- Subtle magical grid pattern (very faint) -->
  <defs>
    <pattern id="magicGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7C3AED" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1440" height="900" fill="url(#magicGrid)"/>
  
  <!-- Header with arcane border -->
  <rect width="1440" height="80" fill="#1A2332" stroke="#7C3AED" stroke-width="2" opacity="0.6" filter="url(#headerGlow)"/>
  
  <!-- Header bottom glow line -->
  <line x1="0" y1="80" x2="1440" y2="80" stroke="#00D9FF" stroke-width="1" opacity="0.3"/>
  
  <!-- Logo section -->
  <g filter="url(#headerGlow)">
    <!-- Logo eye -->
    <circle cx="40" cy="40" r="20" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.8"/>
    <circle cx="40" cy="40" r="14" fill="#0B3D91"/>
    <circle cx="35" cy="35" r="4" fill="#00D9FF" opacity="0.8"/>
    <circle cx="33" cy="33" r="1.5" fill="#FFD700"/>
  </g>
  
  <!-- Brand text -->
  <text x="75" y="50" font-family="'Cinzel', serif" font-size="24" font-weight="700" fill="#F8F9FA" filter="url(#headerGlow)">Vision TCG</text>
  
  <!-- Magical runes accent -->
  <g fill="#D4AF37" opacity="0.3">
    <rect x="72" y="58" width="1.5" height="1.5"/>
    <rect x="78" y="58" width="1.5" height="1.5"/>
    <rect x="84" y="58" width="1.5" height="1.5"/>
  </g>
  
  <!-- Search bar (arcane) -->
  <rect x="400" y="24" width="400" height="40" rx="20" fill="#2A3347" stroke="#7C3AED" stroke-width="1.5" opacity="0.6" filter="url(#headerGlow)"/>
  <text x="420" y="48" font-family="'Inter', sans-serif" font-size="14" fill="#B8BCC4">🔮 Search listings...</text>
  
  <!-- Search glow effect -->
  <circle cx="600" cy="44" r="22" fill="none" stroke="#00D9FF" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Nav profile icon area -->
  <circle cx="1350" cy="40" r="20" fill="#7C3AED" opacity="0.3" filter="url(#headerGlow)"/>
  <circle cx="1350" cy="40" r="18" fill="none" stroke="#C77DFF" stroke-width="1.5" opacity="0.7"/>
  <text x="1350" y="46" font-family="'Inter', sans-serif" font-size="16" fill="#FFD700" text-anchor="middle" font-weight="600" filter="url(#headerGlow)">👑</text>
  
  <!-- Main content area -->
  <g>
    <!-- Title section with magical text -->
    <text x="48" y="130" font-family="'Cinzel', serif" font-size="32" font-weight="700" fill="#F8F9FA" filter="url(#headerGlow)">Featured Listings</text>
    
    <!-- Rune decoration under title -->
    <g stroke="#D4AF37" stroke-width="1" opacity="0.3">
      <line x1="48" y1="140" x2="280" y2="140"/>
    </g>
    
    <text x="48" y="160" font-family="'Inter', sans-serif" font-size="14" fill="#B8BCC4">Browse amazing items from our community</text>
    
    <!-- Card Grid (3 columns) with magical styling -->
    <!-- Card 1 -->
    <g>
      <rect x="48" y="200" width="400" height="280" rx="12" fill="#252E3E" stroke="#7C3AED" stroke-width="2" opacity="0.6" filter="url(#headerGlow)"/>
      
      <!-- Card inner border (subtle) -->
      <rect x="50" y="202" width="396" height="276" rx="11" fill="none" stroke="#3A4557" stroke-width="1" opacity="0.8"/>
      
      <!-- Image -->
      <rect x="64" y="216" width="368" height="140" rx="6" fill="#3A4557" stroke="#7C3AED" stroke-width="1" opacity="0.5"/>
      <text x="248" y="291" font-family="'Inter', sans-serif" font-size="13" fill="#B8BCC4" text-anchor="middle" opacity="0.6">✨ Image</text>
      
      <!-- Pixel magic pattern on image -->
      <g fill="#7C3AED" opacity="0.15">
        <rect x="70" y="225" width="2" height="2"/>
        <rect x="90" y="235" width="2" height="2"/>
        <rect x="110" y="228" width="2" height="2"/>
        <rect x="130" y="240" width="2" height="2"/>
        <rect x="150" y="232" width="2" height="2"/>
      </g>
      
      <!-- Eye logo -->
      <circle cx="416" cy="228" r="7" fill="none" stroke="#00D9FF" stroke-width="2" opacity="0.8" filter="url(#headerGlow)"/>
      <circle cx="416" cy="228" r="4" fill="#00D9FF" opacity="0.3"/>
      
      <!-- Content -->
      <text x="64" y="380" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#F8F9FA">Rare Holographic</text>
      <text x="64" y="404" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#FFD700" filter="url(#headerGlow)">$89.99</text>
      
      <!-- Price sparkle -->
      <circle cx="145" cy="398" r="1" fill="#FFD700" opacity="0.6"/>
      <circle cx="155" cy="396" r="0.8" fill="#FFB700" opacity="0.5"/>
      
      <!-- Location -->
      <circle cx="64" cy="428" r="2.5" fill="#00D9FF" opacity="0.8"/>
      <text x="74" y="431" font-family="'Inter', sans-serif" font-size="12" fill="#B8BCC4">New York, NY</text>
      
      <!-- Arcane divider -->
      <g fill="#7C3AED" opacity="0.5">
        <rect x="64" y="445" width="2" height="2"/>
        <rect x="72" y="445" width="2" height="2"/>
        <rect x="80" y="445" width="2" height="2"/>
        <rect x="88" y="445" width="2" height="2"/>
        <rect x="96" y="445" width="2" height="2"/>
        <rect x="104" y="445" width="2" height="2"/>
      </g>
      
      <!-- Corner magic rune -->
      <g stroke="#00D9FF" stroke-width="1.5" fill="none" opacity="0.4" filter="url(#headerGlow)">
        <path d="M 416 464 L 400 464 L 400 480"/>
      </g>
    </g>
    
    <!-- Card 2 (similar but slightly different color accent) -->
    <g>
      <rect x="520" y="200" width="400" height="280" rx="12" fill="#252E3E" stroke="#7C3AED" stroke-width="2" opacity="0.6" filter="url(#headerGlow)"/>
      <rect x="522" y="202" width="396" height="276" rx="11" fill="none" stroke="#3A4557" stroke-width="1" opacity="0.8"/>
      
      <rect x="536" y="216" width="368" height="140" rx="6" fill="#3A4557" stroke="#C77DFF" stroke-width="1" opacity="0.5"/>
      <text x="720" y="291" font-family="'Inter', sans-serif" font-size="13" fill="#B8BCC4" text-anchor="middle" opacity="0.6">✨ Image</text>
      
      <circle cx="888" cy="228" r="7" fill="none" stroke="#C77DFF" stroke-width="2" opacity="0.8" filter="url(#headerGlow)"/>
      <circle cx="888" cy="228" r="4" fill="#C77DFF" opacity="0.3"/>
      
      <text x="536" y="380" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#F8F9FA">Vintage Collection</text>
      <text x="536" y="404" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#FFD700" filter="url(#headerGlow)">$45.50</text>
      
      <circle cx="536" cy="428" r="2.5" fill="#C77DFF" opacity="0.8"/>
      <text x="546" y="431" font-family="'Inter', sans-serif" font-size="12" fill="#B8BCC4">Los Angeles, CA</text>
      
      <g fill="#7C3AED" opacity="0.5">
        <rect x="536" y="445" width="2" height="2"/>
        <rect x="544" y="445" width="2" height="2"/>
        <rect x="552" y="445" width="2" height="2"/>
        <rect x="560" y="445" width="2" height="2"/>
        <rect x="568" y="445" width="2" height="2"/>
        <rect x="576" y="445" width="2" height="2"/>
      </g>
    </g>
    
    <!-- Card 3 (with rare/epic status) -->
    <g>
      <rect x="992" y="200" width="400" height="280" rx="12" fill="#252E3E" stroke="#00D9FF" stroke-width="2" opacity="0.8" filter="url(#headerGlow)"/>
      <rect x="994" y="202" width="396" height="276" rx="11" fill="none" stroke="#3A4557" stroke-width="1" opacity="0.8"/>
      
      <!-- Rare status glow -->
      <rect x="992" y="200" width="400" height="280" rx="12" fill="none" stroke="#00D9FF" stroke-width="0.5" opacity="0.3" filter="url(#headerGlow)"/>
      
      <rect x="1008" y="216" width="368" height="140" rx="6" fill="#3A4557" stroke="#00D9FF" stroke-width="1" opacity="0.5"/>
      <text x="1192" y="291" font-family="'Inter', sans-serif" font-size="13" fill="#B8BCC4" text-anchor="middle" opacity="0.6">✨ Image</text>
      
      <circle cx="1360" cy="228" r="7" fill="none" stroke="#00D9FF" stroke-width="2" opacity="0.8" filter="url(#headerGlow)"/>
      <circle cx="1360" cy="228" r="4" fill="#00D9FF" opacity="0.3"/>
      
      <text x="1008" y="380" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#F8F9FA">Limited Edition</text>
      <text x="1008" y="400" font-family="'Inter', sans-serif" font-size="11" fill="#00D9FF" font-weight="500">⭐ RARE</text>
      <text x="1008" y="424" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#FFD700" filter="url(#headerGlow)">$125.00</text>
      
      <circle cx="1008" cy="448" r="2.5" fill="#00D9FF" opacity="0.8"/>
      <text x="1018" y="451" font-family="'Inter', sans-serif" font-size="12" fill="#B8BCC4">Chicago, IL</text>
    </g>
  </g>
  
  <!-- Magical corner runes (4 coins) -->
  <g stroke="#D4AF37" stroke-width="2" fill="none" opacity="0.5" filter="url(#headerGlow)">
    <path d="M 16 16 L 32 16 L 32 32"/>
    <path d="M 1424 16 L 1408 16 L 1408 32"/>
    <path d="M 16 884 L 32 884 L 32 868"/>
    <path d="M 1424 884 L 1408 884 L 1408 868"/>
  </g>
  
  <!-- Mystical sparkles -->
  <g fill="#FFD700" opacity="0.3">
    <circle cx="24" cy="24" r="1"/>
    <circle cx="1416" cy="24" r="1"/>
    <circle cx="24" cy="876" r="1"/>
    <circle cx="1416" cy="876" r="1"/>
  </g>
</svg>
