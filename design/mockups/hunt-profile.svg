<svg viewBox="0 0 1440 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="profileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121633;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGradProfile" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="1200" fill="url(#profileBg)"/>
  
  <!-- HEADER -->
  <rect width="1440" height="100" fill="#121633" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
  <rect width="1440" height="100" fill="url(#headerGradProfile)"/>
  <line x1="0" y1="100" x2="1440" y2="100" stroke="#7C3AED" stroke-width="1" opacity="0.2"/>
  
  <!-- Back button + Title -->
  <g>
    <rect x="24" y="24" width="32" height="32" rx="6" fill="#7C3AED" opacity="0.15" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
    <text x="40" y="45" font-family="Outfit, sans-serif" font-size="18" font-weight="700" fill="#CBD5E1" text-anchor="middle">←</text>
    
    <text x="70" y="50" font-family="Outfit, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">Profil de Chasse</text>
    <text x="70" y="72" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">Configurez votre chasse idéale</text>
  </g>
  
  <!-- PROFILE NAME CARD (prominent) -->
  <g>
    <rect x="24" y="116" width="1392" height="100" rx="12" fill="#7C3AED" opacity="0.1" stroke="#7C3AED" stroke-width="2" opacity="0.5"/>
    
    <text x="48" y="140" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">Profil actif</text>
    <text x="48" y="175" font-family="Outfit, sans-serif" font-size="42" font-weight="700" fill="#7C3AED">Wizards FR</text>
    
    <text x="1360" y="140" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1" text-anchor="end">Créé il y a 14 jours</text>
    <text x="1360" y="175" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#7C3AED" text-anchor="end">47 opportunités détectées</text>
  </g>
  
  <!-- MAIN CONTENT GRID -->
  
  <!-- LEFT COLUMN - HUNT OBJECTIVES -->
  <g>
    <rect x="24" y="236" width="672" height="420" rx="12" fill="#1A1F3A" opacity="0.5" stroke="#E6B85C" stroke-width="1" opacity="0.15"/>
    
    <text x="48" y="265" font-family="Outfit, sans-serif" font-size="16" font-weight="700" fill="#E6B85C" letter-spacing="1">OBJECTIF DE CHASSE</text>
    
    <text x="48" y="295" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1" font-style="italic">
      <tspan x="48" y="295">Détecter les cartes Pokémon anciennes françaises</tspan>
      <tspan x="48" y="312">potentiellement sous-évaluées.</tspan>
    </text>
    
    <!-- SEARCH CRITERIA Section -->
    <text x="48" y="355" font-family="Outfit, sans-serif" font-size="12" font-weight="700" fill="#FFD700" letter-spacing="1">CRITÈRES DE RECHERCHE</text>
    
    <g>
      <!-- Criteria items (checks) -->
      <circle cx="32" cy="385" r="2.5" fill="#10B981"/>
      <text x="48" y="389" font-family="Inter, sans-serif" font-size="12" fill="#CBD5E1">Set de base (Base Set)</text>
      
      <circle cx="32" cy="413" r="2.5" fill="#10B981"/>
      <text x="48" y="417" font-family="Inter, sans-serif" font-size="12" fill="#CBD5E1">Jungle</text>
      
      <circle cx="32" cy="441" r="2.5" fill="#10B981"/>
      <text x="48" y="445" font-family="Inter, sans-serif" font-size="12" fill="#CBD5E1">Fossile</text>
      
      <circle cx="32" cy="469" r="2.5" fill="#10B981"/>
      <text x="48" y="473" font-family="Inter, sans-serif" font-size="12" fill="#CBD5E1">Team Rocket</text>
      
      <circle cx="32" cy="497" r="2.5" fill="#10B981"/>
      <text x="48" y="501" font-family="Inter, sans-serif" font-size="12" fill="#CBD5E1">Neo Genesis · Gym · 1999–2002</text>
    </g>
    
    <!-- EXCLUSIONS Section -->
    <text x="48" y="545" font-family="Outfit, sans-serif" font-size="12" font-weight="700" fill="#F59E0B" letter-spacing="1">EXCLUSIONS</text>
    
    <g>
      <circle cx="32" cy="573" r="1.5" fill="#F59E0B"/>
      <text x="48" y="577" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">✗ Proxy, Fake, Custom</text>
      
      <circle cx="32" cy="598" r="1.5" fill="#F59E0B"/>
      <text x="48" y="602" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">✗ Cartes PSA/CGC (trop cher)</text>
    </g>
  </g>
  
  <!-- RIGHT COLUMN - BOOSTS & SETTINGS -->
  <g>
    <rect x="720" y="236" width="696" height="420" rx="12" fill="#1A1F3A" opacity="0.5" stroke="#00D9FF" stroke-width="1" opacity="0.15"/>
    
    <text x="744" y="265" font-family="Outfit, sans-serif" font-size="16" font-weight="700" fill="#00D9FF" letter-spacing="1">BOOSTS DE SCORING</text>
    <text x="744" y="287" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">Pondérations appliquées pour calculer le score d'opportunité</text>
    
    <!-- Boost items with sliders representation -->
    <g>
      <!-- Boost 1: Lot ancien -->
      <text x="744" y="315" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">+ Lot ancien (1999–2002)</text>
      <rect x="744" y="325" width="200" height="6" rx="3" fill="#0EA5E9" opacity="0.2" stroke="#0EA5E9" stroke-width="1" opacity="0.3"/>
      <rect x="744" y="325" width="160" height="6" rx="3" fill="#0EA5E9" opacity="0.6"/>
      <text x="952" y="335" font-family="JetBrains Mono" font-size="10" fill="#0EA5E9">+20pts</text>
      
      <!-- Boost 2: Holo -->
      <text x="744" y="365" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">+ Cartes Holo présentes</text>
      <rect x="744" y="375" width="200" height="6" rx="3" fill="#0EA5E9" opacity="0.2" stroke="#0EA5E9" stroke-width="1" opacity="0.3"/>
      <rect x="744" y="375" width="180" height="6" rx="3" fill="#0EA5E9" opacity="0.6"/>
      <text x="952" y="385" font-family="JetBrains Mono" font-size="10" fill="#0EA5E9">+15pts</text>
      
      <!-- Boost 3: FR -->
      <text x="744" y="415" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">+ Édition française confirmée</text>
      <rect x="744" y="425" width="200" height="6" rx="3" fill="#0EA5E9" opacity="0.2" stroke="#0EA5E9" stroke-width="1" opacity="0.3"/>
      <rect x="744" y="425" width="140" height="6" rx="3" fill="#0EA5E9" opacity="0.6"/>
      <text x="952" y="435" font-family="JetBrains Mono" font-size="10" fill="#0EA5E9">+12pts</text>
      
      <!-- Boost 4: Prix bas -->
      <text x="744" y="465" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">+ Prix sous marché (−20%)</text>
      <rect x="744" y="475" width="200" height="6" rx="3" fill="#0EA5E9" opacity="0.2" stroke="#0EA5E9" stroke-width="1" opacity="0.3"/>
      <rect x="744" y="475" width="170" height="6" rx="3" fill="#0EA5E9" opacity="0.6"/>
      <text x="952" y="485" font-family="JetBrains Mono" font-size="10" fill="#0EA5E9">+18pts</text>
      
      <!-- Boost 5: Proximité -->
      <text x="744" y="515" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">+ Vendeur proche (&lt; 50km)</text>
      <rect x="744" y="525" width="200" height="6" rx="3" fill="#0EA5E9" opacity="0.2" stroke="#0EA5E9" stroke-width="1" opacity="0.3"/>
      <rect x="744" y="525" width="120" height="6" rx="3" fill="#0EA5E9" opacity="0.6"/>
      <text x="952" y="535" font-family="JetBrains Mono" font-size="10" fill="#0EA5E9">+8pts</text>
    </g>
    
    <!-- Settings buttons -->
    <rect x="744" y="575" width="332" height="40" rx="6" fill="#0EA5E9" opacity="0.15" stroke="#0EA5E9" stroke-width="1" opacity="0.4"/>
    <text x="910" y="602" font-family="Outfit, sans-serif" font-size="12" font-weight="600" fill="#0EA5E9" text-anchor="middle">⚙ Paramètres avancés</text>
  </g>
  
  <!-- PLATFORMS SECTION -->
  <g>
    <rect x="24" y="676" width="1392" height="180" rx="12" fill="#1A1F3A" opacity="0.5" stroke="#10B981" stroke-width="1" opacity="0.15"/>
    
    <text x="48" y="705" font-family="Outfit, sans-serif" font-size="16" font-weight="700" fill="#10B981" letter-spacing="1">PLATEFORMES DE RECHERCHE ACTIVES</text>
    
    <g>
      <!-- Platform 1: Leboncoin -->
      <rect x="48" y="725" width="300" height="100" rx="8" fill="#0EA5E9" opacity="0.08" stroke="#0EA5E9" stroke-width="1.5" opacity="0.4"/>
      <text x="60" y="748" font-family="Outfit, sans-serif" font-size="14" font-weight="700" fill="#0EA5E9">Leboncoin</text>
      <text x="60" y="768" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">France entière · Mise à jour: 5 min</text>
      <circle cx="60" cy="795" r="3" fill="#10B981"/>
      <text x="72" y="799" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">Actif</text>
      
      <!-- Platform 2: Vinted -->
      <rect x="368" y="725" width="300" height="100" rx="8" fill="#7C3AED" opacity="0.08" stroke="#7C3AED" stroke-width="1.5" opacity="0.4"/>
      <text x="380" y="748" font-family="Outfit, sans-serif" font-size="14" font-weight="700" fill="#7C3AED">Vinted</text>
      <text x="380" y="768" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">France · Mise à jour: 10 min</text>
      <circle cx="380" cy="795" r="3" fill="#10B981"/>
      <text x="392" y="799" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">Actif</text>
      
      <!-- Platform 3: eBay -->
      <rect x="688" y="725" width="300" height="100" rx="8" fill="#FFD700" opacity="0.08" stroke="#FFD700" stroke-width="1.5" opacity="0.3"/>
      <text x="700" y="748" font-family="Outfit, sans-serif" font-size="14" font-weight="700" fill="#FFD700">eBay</text>
      <text x="700" y="768" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">France · Mise à jour: 15 min</text>
      <circle cx="700" cy="795" r="3" fill="#10B981"/>
      <text x="712" y="799" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">Actif</text>
      
      <!-- Platform 4: Custom API -->
      <rect x="1008" y="725" width="408" height="100" rx="8" fill="#00D9FF" opacity="0.08" stroke="#00D9FF" stroke-width="1.5" opacity="0.3"/>
      <text x="1020" y="748" font-family="Outfit, sans-serif" font-size="14" font-weight="700" fill="#00D9FF">Alertes personnalisées</text>
      <text x="1020" y="768" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">Email · Telegram · Discord</text>
      <circle cx="1020" cy="795" r="3" fill="#10B981"/>
      <text x="1032" y="799" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">Configuré</text>
    </g>
  </g>
  
  <!-- HUNTING STATS -->
  <g>
    <rect x="24" y="876" width="1392" height="280" rx="12" fill="#1A1F3A" opacity="0.5" stroke="#FFD700" stroke-width="1" opacity="0.15"/>
    
    <text x="48" y="905" font-family="Outfit, sans-serif" font-size="16" font-weight="700" fill="#FFD700" letter-spacing="1">STATISTIQUES DE CHASSE</text>
    
    <g>
      <!-- Stat 1: Total opportunities -->
      <rect x="48" y="925" width="300" height="100" rx="8" fill="#FFD700" opacity="0.08" stroke="#FFD700" stroke-width="1.5" opacity="0.3"/>
      <text x="60" y="945" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">Total opportunités détectées</text>
      <text x="200" y="1000" font-family="JetBrains Mono" font-size="48" font-weight="700" fill="#FFD700" text-anchor="end">47</text>
      
      <!-- Stat 2: Conversions -->
      <rect x="368" y="925" width="300" height="100" rx="8" fill="#10B981" opacity="0.08" stroke="#10B981" stroke-width="1.5" opacity="0.3"/>
      <text x="380" y="945" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">Achats validés</text>
      <text x="520" y="1000" font-family="JetBrains Mono" font-size="48" font-weight="700" fill="#10B981" text-anchor="end">16</text>
      <text x="520" y="1020" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1" text-anchor="end">(34% de conversion)</text>
      
      <!-- Stat 3: Watchlist -->
      <rect x="688" y="925" width="300" height="100" rx="8" fill="#0EA5E9" opacity="0.08" stroke="#0EA5E9" stroke-width="1.5" opacity="0.3"/>
      <text x="700" y="945" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">En watchlist</text>
      <text x="840" y="1000" font-family="JetBrains Mono" font-size="48" font-weight="700" fill="#0EA5E9" text-anchor="end">12</text>
      
      <!-- Stat 4: Gain moyen -->
      <rect x="1008" y="925" width="408" height="100" rx="8" fill="#7C3AED" opacity="0.08" stroke="#7C3AED" stroke-width="1.5" opacity="0.3"/>
      <text x="1020" y="945" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">Gain moyen estimé par achat</text>
      <text x="1412" y="1000" font-family="JetBrains Mono" font-size="48" font-weight="700" fill="#7C3AED" text-anchor="end">85 €</text>
    </g>
    
    <!-- Action buttons at bottom -->
    <g>
      <rect x="48" y="1050" width="220" height="40" rx="6" fill="#FFD700" opacity="0.2" stroke="#FFD700" stroke-width="1.5" opacity="0.5"/>
      <text x="158" y="1077" font-family="Outfit, sans-serif" font-size="12" font-weight="600" fill="#FFD700" text-anchor="middle">Démarrer chasse</text>
      
      <rect x="288" y="1050" width="220" height="40" rx="6" fill="#0EA5E9" opacity="0.15" stroke="#0EA5E9" stroke-width="1.5" opacity="0.4"/>
      <text x="398" y="1077" font-family="Outfit, sans-serif" font-size="12" font-weight="600" fill="#0EA5E9" text-anchor="middle">Histor ique complet</text>
      
      <rect x="528" y="1050" width="220" height="40" rx="6" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="1.5" opacity="0.4"/>
      <text x="638" y="1077" font-family="Outfit, sans-serif" font-size="12" font-weight="600" fill="#10B981" text-anchor="middle">Dupliquer le profil</text>
      
      <rect x="1192" y="1050" width="224" height="40" rx="6" fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="1.5" opacity="0.4"/>
      <text x="1304" y="1077" font-family="Outfit, sans-serif" font-size="12" font-weight="600" fill="#F59E0B" text-anchor="middle">Suspendre chasse</text>
    </g>
  </g>
</svg>
