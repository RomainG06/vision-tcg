version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/vision-tcg.db
    volumes:
      - db-data:/data
      - ./results:/app/results
      - ./screenshots:/app/screenshots
    depends_on:
      - chromium

  chromium:
    image: browserless/chrome:latest
    ports:
      - "3001:3000"
    environment:
      - CONNECTION_TIMEOUT=600000
      - MAX_CONCURRENT_SESSIONS=5
      - ENABLE_CORS=true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db-data:
